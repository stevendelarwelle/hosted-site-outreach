name: 03 Generate + Publish Site

# Only acts on leads with status=qualified AND approved_for_site=true —
# flip that column to TRUE in data/leads.csv after reviewing qualify
# results/screenshots. Nothing runs against a lead until a human approves it.

on:
  schedule:
    - cron: '0 10 * * *'   # nightly, 10am UTC — after 02 runs
  workflow_dispatch:

permissions:
  contents: write   # the script commits data/leads.csv itself

concurrency:
  group: leads-csv
  cancel-in-progress: false   # queue instead of racing on data/leads.csv

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Claude Opus generation takes time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "hosted-site-outreach[bot]"
          git config user.email "bot@hosted-site-outreach"

      - name: Check secrets
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "❌ ANTHROPIC_API_KEY missing"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "❌ GH_TOKEN missing"; exit 1; }
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_SITES }}

      - name: Generate + publish sites
        run: python -m src.site_generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_SITES }}
          PUBLISH_REPO_OWNER: stevendelarwelle
          PUBLISH_REPO_NAME: vet-demo-sites
          DRY_RUN: ${{ vars.DRY_RUN }}
          SITES_TO_CREATE_PER_RUN: ${{ vars.SITES_TO_CREATE_PER_RUN }}
