name: 01 Source Leads

on:
  schedule:
    - cron: '0 8 * * 1'   # weekly, Monday 8am UTC
  workflow_dispatch:

permissions:
  contents: write   # the script commits data/leads.csv itself

concurrency:
  group: leads-csv
  cancel-in-progress: false   # queue instead of racing on data/leads.csv

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "hosted-site-outreach[bot]"
          git config user.email "bot@hosted-site-outreach"

      - name: Check secrets
        run: |
          [ -n "$GOOGLE_API_KEY" ] || { echo "❌ GOOGLE_API_KEY missing"; exit 1; }
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Source leads
        run: python -m src.places
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
