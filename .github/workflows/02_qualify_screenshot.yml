name: 02 Qualify + Screenshot

on:
  schedule:
    - cron: '0 9 * * *'   # nightly, 9am UTC
  workflow_dispatch:

permissions:
  contents: write   # the script commits data/leads.csv + screenshots/ itself

concurrency:
  group: leads-csv
  cancel-in-progress: false   # queue instead of racing on data/leads.csv

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Playwright launches are slow, batch capped at 20 leads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name "hosted-site-outreach[bot]"
          git config user.email "bot@hosted-site-outreach"

      - name: Check secrets
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "❌ ANTHROPIC_API_KEY missing"; exit 1; }
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Qualify leads
        run: python -m src.qualify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
